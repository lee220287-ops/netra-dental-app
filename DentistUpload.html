<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書類提出</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
:root{
  --bg: #F4F5F1;
  --panel: #FFFFFF;
  --ink: #17211E;
  --ink-soft: #5B655F;
  --line: #DBE0D8;
  --teal: #0F4C46;
  --teal-soft: #E4EFEC;
  --red: #A5382C;
  --red-soft: #FAE7E3;
  --green: #2C7A4B;
  --green-soft: #E4F2E7;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  padding:20px 16px 60px;
}
.wrap{max-width:520px;margin:0 auto;}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  font-weight:700;
  margin:0 0 6px;
}
.sub{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin-bottom:20px;}
.clinic-tag{
  display:inline-block;background:var(--teal-soft);color:var(--teal);
  font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;margin-bottom:16px;
}
.doc-slot{
  border:1.5px dashed var(--line);
  border-radius:10px;padding:16px;
  margin-bottom:12px;
  position:relative;
}
.doc-slot.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft);}
.doc-slot.drag{border-color:var(--teal);background:var(--teal-soft);}
.doc-label{font-weight:700;font-size:15px;margin-bottom:4px;display:block;}
.doc-already{font-size:12px;color:var(--green);margin-bottom:8px;}
.doc-filename{font-size:13px;color:var(--ink);word-break:break-all;margin-top:6px;}
.doc-empty{font-size:13px;color:#8A9289;}
.doc-sync{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.doc-sync.err{color:var(--red);}
.file-btn{
  display:inline-block;background:var(--ink);color:#fff;border:none;
  padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:8px;
}
input[type=file]{display:none;}
.done-btn{
  width:100%;background:var(--teal);color:#fff;border:none;
  padding:16px;border-radius:10px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:20px;
}
.notice{font-size:12.5px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:18px;line-height:1.6;}
.error-box{background:var(--red-soft);color:var(--red);padding:14px;border-radius:8px;font-size:14px;}
.notice-box{background:var(--teal-soft);color:var(--teal);padding:20px;border-radius:10px;font-size:14px;line-height:1.7;text-align:center;}
.success-box{background:var(--green-soft);color:var(--green);padding:20px;border-radius:10px;font-size:15px;text-align:center;font-weight:600;}
.loading{color:var(--ink-soft);font-size:14px;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">読み込み中…</div>
</div>

<script>
const CATEGORIES = [
  {key:'dental', label:'歯科（既存）'},
  {key:'dental_new', label:'歯科（開院直後）'},
  {key:'dental_preopen', label:'歯科（開院前）'},
  {key:'individual_staff', label:'個人（勤務者）'},
  {key:'lab', label:'技工所'},
  {key:'other', label:'一般事業者'}
];

const FIELD_LABELS = {
  companyName:'医院名／事業所名', address:'住所', representative:'代表者名',
  personInCharge:'担当者名', email:'メールアドレス', phone:'電話番号',
  fax:'FAX番号', postalCode:'郵便番号', institutionCode:'医療機関コード',
  licenseNumber:'ライセンス番号', managerFounder:'管理者／開設者',
  openingDate:'開院日', homepageUrl:'ホームページURL', salesArea:'営業担当エリア'
};

const DOC_MATRIX = {
  dental: [
    {key:'license', label:'歯科医師免許証', submitter:'customer', verifies:['representative', 'licenseNumber']},
    {key:'maron_capture', label:'医療機関キャプチャ（マロンホームページ）', submitter:'sales', verifies:['companyName', 'address', 'representative', 'phone', 'institutionCode', 'managerFounder']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'representative', 'email', 'phone', 'fax', 'postalCode']},
    {key:'homepage_director_capture', label:'歯科ホームページ 院長キャプチャ', submitter:'sales', verifies:['companyName', 'address', 'representative', 'phone', 'fax', 'postalCode', 'homepageUrl']},
    {key:'corp_registry', label:'全部事項証明書（法人登記）', submitter:'customer', verifies:['companyName', 'address', 'representative']}
  ],
  dental_new: [
    {key:'license', label:'歯科医師免許証', submitter:'customer', verifies:['representative', 'licenseNumber']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'representative', 'email', 'phone', 'fax', 'postalCode']},
    {key:'homepage_opening_capture', label:'歯科ホームページ 開院案内キャプチャ', submitter:'sales', verifies:['companyName', 'address', 'phone', 'postalCode', 'openingDate', 'homepageUrl']},
    {key:'homepage_director_confirm', label:'歯科ホームページ 院長確認', submitter:'sales', verifies:['representative']},
    {key:'corp_registry', label:'全部事項証明書（法人登記）', submitter:'customer', verifies:['companyName', 'address', 'representative']}
  ],
  dental_preopen: [
    {key:'license', label:'歯科医師免許証', submitter:'customer', verifies:['representative', 'licenseNumber']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'representative', 'email', 'phone', 'fax', 'postalCode']},
    {key:'homepage_opening_capture', label:'歯科ホームページ(有) 開院案内キャプチャ', submitter:'sales', verifies:['companyName', 'address', 'representative', 'phone', 'postalCode', 'openingDate', 'homepageUrl']},
    {key:'homepage_director_confirm', label:'歯科ホームページ(有) 院長確認', submitter:'sales', verifies:['representative']},
    {key:'internet_search', label:'インターネット検索（求人広告または住所・地域と医院名が確認できる資料）', submitter:'sales', verifies:['companyName', 'openingDate', 'salesArea']},
    {key:'corp_registry', label:'全部事項証明書（法人登記）', submitter:'customer', verifies:['companyName', 'address', 'representative']},
    {key:'construction_plan', label:'建設計画書等（未完工の場合）', submitter:'customer', verifies:['address', 'salesArea']}
  ],
  individual_staff: [
    {key:'license_individual', label:'歯科医師免許証（個人）', submitter:'customer', verifies:['personInCharge', 'licenseNumber']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'personInCharge', 'email', 'phone', 'fax', 'postalCode']},
    {key:'homepage_license_match', label:'歯科ホームページ（免許証本人マッチング）', submitter:'customer', verifies:['companyName', 'address', 'personInCharge']},
    {key:'employment_proof', label:'社員証及び勤務中証明資料（免許証本人マッチング）', submitter:'customer', verifies:['companyName', 'personInCharge']}
  ],
  lab: [
    {key:'lab_license', label:'技工士免許証（個人）', submitter:'customer', verifies:['representative', 'personInCharge']},
    {key:'lab_registration', label:'技工所開設登録証', submitter:'customer', verifies:['companyName', 'address', 'representative', 'personInCharge', 'licenseNumber', 'managerFounder']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'representative', 'personInCharge', 'email', 'phone', 'fax', 'postalCode']},
    {key:'lab_homepage', label:'技工所ホームページキャプチャ', submitter:'sales', verifies:['companyName', 'address', 'phone', 'postalCode']},
    {key:'corp_number_check', label:'法人番号確認（国税庁法人番号公表サイト）', submitter:'sales', verifies:['companyName', 'address', 'licenseNumber']},
    {key:'corp_registry', label:'全部事項証明書（法人登記）', submitter:'customer', verifies:['companyName', 'address', 'representative', 'postalCode']}
  ],
  other: [
    {key:'license_dental_or_lab', label:'歯科医師免許証／技工士免許証', submitter:'customer', verifies:['representative', 'personInCharge']},
    {key:'lab_registration', label:'技工所開設登録証', submitter:'customer', verifies:['companyName', 'address', 'phone', 'postalCode']},
    {key:'business_card', label:'名刺', submitter:'both', verifies:['companyName', 'address', 'representative', 'personInCharge', 'email', 'phone', 'fax', 'postalCode']},
    {key:'lab_homepage', label:'技工所ホームページキャプチャ', submitter:'sales', verifies:['companyName', 'address']},
    {key:'corp_number_check', label:'法人番号確認（国税庁法人番号公表サイト）', submitter:'sales', verifies:['companyName', 'address', 'phone', 'postalCode']}
  ]
};

function docsForCategory(catKey){
  return DOC_MATRIX[catKey] || DOC_MATRIX['dental'];
}
function categoryLabel(catKey){
  const c = CATEGORIES.find(x=>x.key===catKey);
  return c ? c.label : catKey;
}
// 旧バージョン（事業者biz／個人indiv の2種類）で保存されたケースを新しいカテゴリ体系に自動変換します。
function normalizeRegType(regType, preOpen){
  if(regType === 'biz') return preOpen ? 'dental_preopen' : 'dental';
  if(regType === 'indiv') return 'individual_staff';
  if(CATEGORIES.some(cat => cat.key === regType)) return regType;
  return 'dental';
}

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let caseId = '';
let caseInfo = null;
let myFiles = {};

// ===== API_URL: Index.html과 동일한 Apps Script exec 주소를 넣어주세요 =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxMwRQYmz7HyDBE3bjbMwNAnKHW25fPFUsTIBPKSxqAjLe4JWFmtHpZaGLY-T__yCHq/exec';

function gsRun(fnName, ...args){
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ fn: fnName, args: args })
  })
    .then(res => res.json())
    .then(data => {
      if(data && data.__error){ throw new Error(data.__error); }
      return data;
    });
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('ファイル読み込みに失敗しました'));
    r.readAsDataURL(file);
  });
}
function mimeFor(file){
  if(file.type) return file.type;
  const n = file.name.toLowerCase();
  if(n.endsWith('.png')) return 'image/png';
  if(n.endsWith('.jpg')||n.endsWith('.jpeg')) return 'image/jpeg';
  return 'application/octet-stream';
}
function resizeImage(file, maxDim=1800, quality=0.88){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.width, height = img.height;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({base64: dataUrl.split(',')[1], mime:'image/jpeg'});
    };
    img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
    img.src = url;
  });
}
async function pdfToImages(file, maxPages=4, maxDim=1800, quality=0.85){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const n = Math.min(pdf.numPages, maxPages);
  const pages = [];
  for(let i=1; i<=n; i++){
    const page = await pdf.getPage(i);
    const base = page.getViewport({scale:1});
    const scale = Math.min(maxDim/base.width, maxDim/base.height);
    const viewport = page.getViewport({scale: Math.max(scale, 0.3)});
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport}).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    pages.push({base64: dataUrl.split(',')[1], mime:'image/jpeg'});
  }
  return pages;
}

async function handleFile(docKey, file){
  if(!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  const isImage = !isPdf && (file.type.startsWith('image/') || /\.(png|jpe?g|webp)$/i.test(file.name));
  let pages;
  try{
    if(isPdf){ pages = await pdfToImages(file); }
    else if(isImage){ pages = [await resizeImage(file)]; }
    else { pages = [{base64: await fileToBase64(file), mime: mimeFor(file)}]; }
  }catch(e){
    alert('ファイルを処理できませんでした: ' + e.message);
    return;
  }
  myFiles[docKey] = { name: file.name, pageCount: pages.length, syncing: true, syncError: false, synced: false };
  render();

  try{
    const resp = await gsRun('uploadCaseFile', caseId, docKey, pages, 'dentist', file.name);
    myFiles[docKey].syncing = false;
    myFiles[docKey].syncError = !(resp && resp.ok);
    myFiles[docKey].synced = !!(resp && resp.ok);
  }catch(e){
    myFiles[docKey].syncing = false;
    myFiles[docKey].syncError = true;
  }
  render();
}

function docSlotHTML(doc){
  const f = myFiles[doc.key];
  const alreadyThere = caseInfo.filledDocKeys.includes(doc.key) && !f;
  return `
    <div class="doc-slot ${f ? 'filled' : ''}"
      ondragover="event.preventDefault(); event.currentTarget.classList.add('drag')"
      ondragleave="event.currentTarget.classList.remove('drag')"
      ondrop="onDentistDrop(event,'${doc.key}')">
      <span class="doc-label">${doc.label}</span>
      ${alreadyThere ? `<div class="doc-already">✓ すでに提出されている項目です（差し替えも可能です）</div>` : ''}
      ${f
        ? `<div class="doc-filename">📄 ${f.name}${f.pageCount>1 ? `（${f.pageCount}ページ）` : ''}</div>`
        : `<div class="doc-empty">未添付（クリックまたはドラッグ＆ドロップで添付）</div>`}
      ${f && f.syncing ? `<div class="doc-sync">⏳ 送信中…</div>` : ''}
      ${f && f.syncError ? `<div class="doc-sync err">⚠ 送信に失敗しました。もう一度お試しください。</div>` : ''}
      ${f && f.synced ? `<div class="doc-sync" style="color:var(--green);">✓ 送信完了</div>` : ''}
      <label class="file-btn">
        ${f ? '差し替える' : '写真を撮る／選択する'}
        <input type="file" accept=".pdf,image/*" onchange="handleFile('${doc.key}', this.files[0])">
      </label>
    </div>`;
}

function onDentistDrop(e, docKey){
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if(file) handleFile(docKey, file);
}

function render(){
  // 顧客提出画面には、提出者が「customer」または「both」の書類のみを表示します
  // （営業担当者専用の書類は表示しません）。
  const relevantDocs = docsForCategory(caseInfo.regType).filter(d => d.submitter === 'customer' || d.submitter === 'both');
  document.getElementById('app').innerHTML = `
    <h1>書類のご提出</h1>
    <p class="sub">このページはあなた専用の提出フォームです。担当者がすでに提出した書類の内容は表示されません。ご自身の端末で直接撮影・添付していただけます。添付すると自動的に送信されます。</p>
    ${caseInfo.name ? `<div class="clinic-tag">${caseInfo.name}</div>` : ''}
    <div class="notice">登録区分: ${categoryLabel(caseInfo.regType)}<br>該当する書類の中から、ご提出いただけるものを選んで添付してください（すべて揃っていなくても提出可能です）。</div>
    <div id="docGrid">${relevantDocs.map(docSlotHTML).join('')}</div>
    <button class="done-btn" onclick="finishSubmission()">提出を完了する</button>
  `;
}

function finishSubmission(){
  const submittedCount = Object.values(myFiles).filter(f => f.synced).length;
  if(submittedCount === 0){
    const proceed = confirm('まだ何も送信されていません。このまま終了しますか？');
    if(!proceed) return;
  }
  document.getElementById('app').innerHTML = `<div class="success-box">✓ 提出が完了しました。<br>ご協力ありがとうございました。<br>このページは閉じていただいて構いません。</div>`;
}

function showError(msg){
  document.getElementById('app').innerHTML = `<div class="error-box">${msg}</div>`;
}

function showNotice(msg){
  document.getElementById('app').innerHTML = `<div class="notice-box">ℹ️ ${msg}</div>`;
}

(function(){
  const params = new URLSearchParams(window.location.search);
  caseId = params.get('caseId') || '';
  if(!caseId){
    showError('リンクが正しくありません。担当者にもう一度リンクを発行してもらってください。');
    return;
  }
  gsRun('getCaseInfo', caseId)
    .then(function(resp){
      if(!resp || !resp.ok){
        if(resp && resp.deleted){
          showNotice(resp.error);
          return;
        }
        showError((resp && resp.error) || 'ケース情報を取得できませんでした。');
        return;
      }
      caseInfo = resp;
      caseInfo.regType = normalizeRegType(caseInfo.regType, caseInfo.preOpen);
      render();
    })
    .catch(function(err){
      showError('通信エラーが発生しました: ' + err.message);
    });
})();
</script>
</body>
</html>
