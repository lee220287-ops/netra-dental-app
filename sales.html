<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新規登録 入力依頼（営業用）</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5d6b7a;--pri:#0b5cad;--ok:#0a7a45;--err:#b3261e;--line:#d8dee6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:8px 0 4px}p.lead{color:var(--sub);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
input:focus{outline:2px solid var(--pri);border-color:var(--pri)}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}button.ghost{background:none;color:var(--pri);border:1px solid var(--pri);margin-top:10px}
.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap}
.msg.ok{background:#e6f5ec;color:var(--ok)}.msg.err{background:#fdecea;color:var(--err)}
.who{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.who a{color:var(--pri);cursor:pointer}.hide{display:none}
.srch{display:grid;grid-template-columns:1fr auto;gap:8px}.srch button{width:auto;margin:0;padding:0 18px}
.res{display:block;width:100%;text-align:left;margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:400;font-size:14px}.res b{display:block}.res small{color:var(--sub)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg-i{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;font-weight:600;cursor:pointer}.seg-i input{width:auto}
</style></head><body><div class="wrap">
<h1>新規登録 入力依頼</h1>
<p class="lead">お客様のメールアドレスを入力して送信すると、お客様専用の入力ページがメールで届きます。</p>
<div id="loginCard" class="card"><p style="margin-top:0">会社のGoogleアカウント（@osstemjapan.com）でログインしてください。</p><div id="gbtn"></div><div id="loginMsg" class="msg err hide"></div></div>
<div id="formCard" class="card hide">
  <div class="who"><span id="whoTxt"></span><a id="logout">ログアウト</a></div>
  <label>依頼の種類</label>
  <div class="seg"><label class="seg-i"><input type="radio" name="rtype" value="新規" checked> 新規登録</label><label class="seg-i"><input type="radio" name="rtype" value="変更"> 登録内容の変更</label></div>
  <div id="numBox" class="hide">
    <label for="q">お客様を探す（病院名・顧客番号・電話番号の一部）</label>
    <div class="srch"><input id="q" type="text" autocomplete="off" placeholder="例：○○歯科／12345／03-1234"><button id="qbtn" type="button" class="ghost">検索</button></div>
    <div id="qres"></div>
    <label for="custNo">顧客番号</label><input id="custNo" type="text" autocomplete="off" placeholder="検索して選ぶか、直接入力（例：K12345）">
  </div>
  <label for="salesEmail">あなたのメールアドレス（進捗・結果の受信用）</label>
  <input id="salesEmail" type="email" inputmode="email" autocomplete="email">
  <label for="custEmail">お客様のメールアドレス（送信先）</label>
  <input id="custEmail" type="email" inputmode="email" placeholder="example@clinic.jp">
  <button id="send">お客様へ送信する</button>
  <div id="msg" class="msg hide"></div>
  <button id="again" class="ghost hide">続けて別のお客様へ送る</button>
</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxMwRQYmz7HyDBE3bjbMwNAnKHW25fPFUsTIBPKSxqAjLe4JWFmtHpZaGLY-T__yCHq/exec';
// ★ 許可するドメイン。テスト中は gmail.com、本番は osstemjapan.com に変更（Config の allowedSalesDomain も同じ値に）
const ALLOWED_DOMAIN='gmail.com';
const CLIENT_ID='696950584060-7uqisvvijoq39urnr3okp3s3r5s1vhht.apps.googleusercontent.com';
const $=id=>document.getElementById(id);
let idToken=null;
const rtype=()=>document.querySelector('input[name=rtype]:checked').value;
async function doSearch(){
  const box=$('qres');box.innerHTML='';const q=$('q').value.trim();if(!q)return;
  $('qbtn').disabled=true;box.textContent='検索中…';
  try{
    const r=await gsRun('searchCustomers',idToken,q);box.textContent='';
    if(!r.ok){box.textContent=r.error||'検索に失敗しました。';return;}
    if(!r.results.length){box.textContent='該当するお客様が見つかりません。';return;}
    r.results.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='res';
      const n=document.createElement('b');n.textContent=c.name||'（名称なし）';const s=document.createElement('small');s.textContent=c.customerNumber+'　'+(c.address||'')+'　'+(c.tel||'');
      b.append(n,s);b.onclick=()=>{$('custNo').value=c.customerNumber;if(c.email&&!$('custEmail').value)$('custEmail').value=c.email;box.innerHTML='';const ok=document.createElement('div');ok.className='msg ok';ok.textContent='選択：'+(c.name||'')+'（'+c.customerNumber+'）';box.appendChild(ok);};box.appendChild(b);});
    if(r.more){const m=document.createElement('div');m.className='hint';m.textContent='ほかにも該当があります。条件を絞って検索してください。';box.appendChild(m);}
  }catch(e){box.textContent='通信エラー：'+e.message;}
  $('qbtn').disabled=false;
}
$('qbtn').onclick=doSearch;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});
document.querySelectorAll('input[name=rtype]').forEach(r=>r.addEventListener('change',()=>{$('numBox').classList.toggle('hide',rtype()!=='変更');$('send').textContent=rtype()==='変更'?'お客様へ変更ページを送信する':'お客様へ送信する';}));
function gsRun(fn,...args){return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args})}).then(r=>r.json()).then(d=>{if(d&&d.__error)throw new Error(d.__error);return d;});}
function show(el,t,cls){el.className='msg '+cls;el.textContent=t;}
function parseJwt(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return {};}}
function onLogin(resp){
  idToken=resp.credential;const p=parseJwt(idToken);
  if(!(p.email||'').toLowerCase().endsWith('@'+ALLOWED_DOMAIN)){show($('loginMsg'),'許可されたGoogleアカウント（@'+ALLOWED_DOMAIN+'）でログインしてください。','err');idToken=null;return;}
  $('loginMsg').className='msg err hide';$('loginCard').classList.add('hide');$('formCard').classList.remove('hide');
  $('whoTxt').textContent=(p.name||'')+'（'+p.email+'）';$('salesEmail').value=p.email;
}
window.addEventListener('load',()=>{
  const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.id){clearInterval(t);
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onLogin,hd:ALLOWED_DOMAIN});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with'});}},200);
});
$('logout').onclick=()=>{idToken=null;if(window.google)google.accounts.id.disableAutoSelect();location.reload();};
$('send').onclick=async()=>{
  const m=$('msg');m.className='msg hide';
  const s=$('salesEmail').value.trim(),c=$('custEmail').value.trim();
  const t=rtype(),no=$('custNo').value.trim();
  if(!c){show(m,'お客様のメールアドレスを入力してください。','err');return;}
  if(t==='変更'&&!no){show(m,'顧客番号を入力してください。','err');return;}
  if(!confirm((t==='変更'?'【登録内容の変更】顧客番号 '+no+'\n':'')+'次のお客様へ送信します。よろしいですか？\n\n'+c)){return;}
  $('send').disabled=true;$('send').textContent='送信中…';
  try{
    const r=await gsRun('createRegistrationInvite',idToken,s,c,t,no);
    if(r.ok){show(m,'送信しました。（受付番号：'+r.registrationId+'）\nお客様が入力を完了すると、'+s+' に進捗メールが届きます。','ok');$('again').classList.remove('hide');$('custEmail').value='';$('custNo').value='';}
    else{show(m,r.error||'送信に失敗しました。','err');if(/トークン|ログイン/.test(r.error||''))m.textContent+='\n（一度ログアウトして、もう一度ログインしてください）';}
  }catch(e){show(m,'通信エラー：'+e.message,'err');}
  $('send').disabled=false;$('send').textContent=rtype()==='変更'?'お客様へ変更ページを送信する':'お客様へ送信する';
};
$('again').onclick=()=>{$('msg').className='msg hide';$('again').classList.add('hide');$('custEmail').focus();};
</script></body></html>
